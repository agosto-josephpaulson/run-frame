name: Update frame (half hour)

on:
  schedule:
    - cron: "37 * * * *"   # second run each hour (:07 run is in update.yml)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install pillow requests
          curl -sSL -o inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          mkdir -p fonts && unzip -q inter.zip -d fonts
      - name: Fetch data
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          PLAN_CSV_URL: ${{ secrets.PLAN_CSV_URL }}
        run: python fetch.py > data.json
      - name: Render
        env:
          FONT_DIR: fonts
        run: python render.py data.json site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
